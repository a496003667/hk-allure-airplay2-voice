</tmp/alsa/alsa.conf>

# Private ALSA route for the stock Bluetooth player (a01controller only).
#
# The PCM5121 does not expose the Allure's two drivers as an ordinary stereo
# pair. Harman's plugin sums L+R to mono, splits the signal at about 300 Hz,
# and feeds the 90 mm woofer from the left DAC channel and the mid/high
# drivers from the right channel. Bluetooth must use this route; sending
# ordinary stereo directly to hw:0,0 bypasses the crossover and bass tuning.
#
# Master is the stock 33-step (-60..0 dB) soft-volume control. It must be
# applied before harmandsp so the limiter sees the level that reaches the
# drivers.

pcm_type.harmandsp {
    lib "/system/workdir/lib/libasound_module_pcm_harmandsp.so"
}

pcm.hk_bt_hw {
    type hw
    card 0
    device 0
}

pcm.hk_bt_dsp {
    type harmandsp
    slave.pcm "hk_bt_hw"
    bypassmode 0
    fmt 0
}

pcm.hk_bt_softvol {
    type softvol
    slave.pcm "hk_bt_dsp"
    control {
        name "Master"
        card 0
    }
    min_dB -60.0
    max_dB 0.0
    resolution 33
}
