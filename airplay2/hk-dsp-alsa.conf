</tmp/alsa/alsa.conf>

# Harman DSP route for players that already apply their own gain.
#
# The plugin sums the stereo input into mono and produces the two physical
# driver channels: left = 90 mm woofer, right = three mid/high drivers.
# Shairport applies its -9 dB software ceiling and the voice synthesizer
# applies its own TTS gain, so this route deliberately has no extra softvol.

pcm_type.harmandsp {
    lib "/system/workdir/lib/libasound_module_pcm_harmandsp.so"
}

pcm.hk_harman_hw {
    type hw
    card 0
    device 0
}

pcm.hk_harman_dsp_core {
    type harmandsp
    slave.pcm "hk_harman_hw"
    bypassmode 0
    fmt 0
}

pcm.hk_harman_dsp {
    type plug
    slave.pcm "hk_harman_dsp_core"
}
