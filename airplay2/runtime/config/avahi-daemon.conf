[server]
host-name=hk-allure-ap2
use-ipv4=yes
use-ipv6=no
allow-interfaces=wlan0
ratelimit-interval-usec=1000000
ratelimit-burst=1000
[wide-area]
enable-wide-area=no
[publish]
disable-publishing=no
publish-addresses=yes
publish-hinfo=no
publish-workstation=no
publish-domain=no
[reflector]
enable-reflector=no
[rlimits]
rlimit-core=0
rlimit-data=8388608
rlimit-stack=4194304
rlimit-nofile=64
