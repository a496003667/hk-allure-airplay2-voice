// Shairport Sync 5.6 trial configuration for the Harman Kardon Allure.
// Same output path and volume limits as the 4.3.6 production config; adds a
// localhost-only MQTT client so local buttons can send AirPlay 2 remote
// commands ("hk-ap2/remote").
general = {
    name = "Harman Kardon Allure AP2";
    output_backend = "alsa";
    mdns_backend = "avahi";
    interface = "wlan0";
    port = 7000;
    airplay_device_id = 0x001122334455L; // set to your speaker's wlan0 MAC (hex), e.g. 0x10D07AxxxxxxL
    // "vernier" is upstream's choice for low-powered devices; "basic"
    // (frame drop/insert) is audible and no longer recommended.
    interpolation = "vernier";
    eight_channel_mode = "off";
    six_channel_mode = "off";
    ignore_volume_control = "no";
    volume_range_db = 30;
    // Software attenuation is the effective loudness limit on this output
    // path (ALSA Master is not).  Raised from -12 dB in small listened steps.
    volume_max_db = -6.0;
    default_airplay_volume = -18.0;
    audio_backend_buffer_desired_length_in_seconds = 0.4;
    run_this_when_volume_is_set = "/tmp/hk-ap2/opt/bin/hk-ap2-volume-log";
};

alsa = {
    output_device = "hw:0,0";
    // The PCM512x/I2S path takes S16/S24/S32 at 44.1/48/96 kHz.  Follow the
    // source rate (AAC is 48 kHz, realtime ALAC 44.1 kHz) so nothing is
    // resampled, and use 32-bit samples so software volume keeps its
    // resolution.
    output_rate = (44100, 48000);
    output_format = "S32_LE";
    output_channels = 2;
    use_precision_timing = "no";
    use_mmap_if_available = "no";
    use_hardware_mute_if_available = "no";
    // Local patch: ramp the DAC's digital volume to zero before the output is
    // dropped (pause, seek, another sender taking over), so it fades instead
    // of popping.
    fade_control_name = "Digital Playback Volume";
};

// MQTT needs metadata enabled (built without the metadata pipe).
metadata = {
    enabled = "yes";
    include_cover_art = "no";
};

mqtt = {
    enabled = "yes";
    hostname = "127.0.0.1";
    port = 1883;
    topic = "hk-ap2";
    publish_raw = "no";
    publish_parsed = "no";
    publish_cover = "no";
    enable_autodiscovery = "no";
    enable_remote = "yes";
};

sessioncontrol = {
    run_this_before_play_begins = "/tmp/hk-ap2/opt/hk-ap2-audio-hook.sh start";
    run_this_after_play_ends = "/tmp/hk-ap2/opt/hk-ap2-audio-hook.sh stop";
    wait_for_completion = "yes";
    allow_session_interruption = "yes";
    session_timeout = 120;
};
